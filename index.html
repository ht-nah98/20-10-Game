<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Show 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Layout: sân khấu cố định 1600x900 scale vừa màn hình.
   Hai loại nền: kem sáng (slide nội dung) và ảnh bìa blur phủ scrim ấm (slide tuyên bố). */
:root{
  --rose:#B03055;
  --rose-deep:#7E1C3C;
  --rose-soft:#EEC6D1;
  --rose-line:#E5B6C4;
  --blush:#FBECF0;
  --sage:#55704A;
  --sage-soft:#DEE8D6;
  --cream:#FCF8F4;
  --paper:#FFFFFF;
  --ink:#332A2D;
  --ink-soft:#786A6E;
  --gold:#A8771F;
  --gold-soft:#F6E9CE;
  --shadow:0 14px 38px rgba(126,28,60,.10);
  --shadow-lift:0 22px 54px rgba(126,28,60,.16);
  --f-display:"Playfair Display",Georgia,serif;
  --f-script:"Dancing Script","Brush Script MT",cursive;
  --f-body:"Be Vietnam Pro","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#F3EDE8;color:var(--ink);font-family:var(--f-body);overflow:hidden;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;flex:none;box-shadow:0 0 0 1px rgba(126,28,60,.08)}
.slide{position:absolute;inset:0;padding:68px 84px;display:none;flex-direction:column;background:var(--cream);overflow:hidden}
.slide.on{display:flex}
.slide.tint{background:linear-gradient(160deg,#FCF8F4 0%,#FBECF0 100%)}

/* ---- slide nền ảnh blur ---- */
.slide.photo{color:#FFF8F4}
.photo h1,.photo h2,.photo h3,.photo p{text-shadow:0 2px 16px rgba(74,14,40,.42)}
.bg{position:absolute;inset:0;overflow:hidden}
.bg img{width:100%;height:100%;object-fit:cover;object-position:28% center;filter:blur(46px) saturate(1.3) brightness(1.06);transform:scale(1.28)}
.bg .scrim{position:absolute;inset:0;background:linear-gradient(118deg,rgba(134,32,76,.82) 0%,rgba(172,54,104,.76) 46%,rgba(198,86,130,.72) 100%)}
.photo .inner{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}

/* ---- chữ ---- */
h1{font-family:var(--f-display);font-size:92px;font-weight:700;line-height:1.04;margin:0;color:var(--rose-deep);text-wrap:balance}
h2{font-family:var(--f-display);font-size:58px;font-weight:600;line-height:1.1;margin:0;color:var(--rose-deep);text-wrap:balance}
h3{font-size:29px;font-weight:700;margin:0;line-height:1.25;color:var(--rose-deep)}
p{font-size:25px;line-height:1.55;margin:0;color:var(--ink)}
.photo h1,.photo h2{color:#FFF6F2}
.photo h3{color:#FFD9E2}
.photo p{color:#FBE6EC}
.eyebrow{font-size:18px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);margin:0 0 16px}
.photo .eyebrow{color:#FBD0DC}
.script{font-family:var(--f-script);font-weight:700;color:var(--rose)}
.photo .script{color:#FFD2DF}
.muted{color:var(--ink-soft);font-size:21px}
.photo .muted{color:#F8E2E9}
.flexfill{flex:1}

/* bút dạ quang - nhấn từ khoá */
.hl{background:linear-gradient(transparent 55%,var(--rose-soft) 55%);padding:0 2px;font-weight:700;color:var(--rose-deep);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.sage{background:linear-gradient(transparent 55%,var(--sage-soft) 55%);color:var(--sage)}
.hl.gold{background:linear-gradient(transparent 55%,var(--gold-soft) 55%);color:var(--gold)}
.photo .hl{background:rgba(255,224,234,.26);border-radius:6px;color:#FFF0F4}

/* ---- thẻ ---- */
.row{display:flex;gap:24px}
.card{background:var(--paper);border:1.5px solid var(--rose-line);border-radius:20px;padding:30px 30px 32px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card.sage{border-color:#C9D8BD;background:#FBFDF9}
.card.gold{border-color:#E6CE9C;background:#FFFCF5;box-shadow:var(--shadow-lift)}
.card.key{border-width:2.5px;border-color:var(--rose);box-shadow:var(--shadow-lift)}
.step{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;flex:none;border-radius:50%;
  background:var(--blush);color:var(--rose);font-family:var(--f-display);font-size:26px;font-weight:700;border:1.5px solid var(--rose-line)}
.card.sage .step{background:var(--sage-soft);color:var(--sage);border-color:#C9D8BD}
.card.gold .step{background:var(--gold-soft);color:var(--gold);border-color:#E6CE9C}
.meta{font-size:17px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:auto;padding-top:8px}
.num{font-family:var(--f-display);font-size:58px;font-weight:700;color:var(--rose);line-height:1}

/* dòng giải thưởng */
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:9px 14px;border-radius:11px;background:var(--blush)}
.prow.g{background:var(--gold-soft)}
.prow span{font-size:21px;font-weight:600;color:var(--ink);white-space:nowrap}
.prow b{font-family:var(--f-display);font-size:30px;color:var(--rose-deep);font-variant-numeric:tabular-nums}
.prow.g b{color:var(--gold)}

/* ---- bảng ---- */
table{border-collapse:collapse;width:100%;font-size:25px}
th,td{padding:14px 16px;text-align:left;border-bottom:1.5px solid var(--rose-line)}
th{font-size:18px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);font-weight:700}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
tr.lead td{background:var(--blush);font-weight:700;color:var(--rose-deep)}
tr.lead td:first-child{border-left:5px solid var(--rose)}
.pill{display:inline-block;padding:6px 18px;border-radius:999px;font-size:19px;font-weight:700;background:var(--sage-soft);color:var(--sage)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}

/* ---- video ---- */
.vidwrap{flex:1;display:flex;gap:26px;min-height:0;margin-top:14px}
.vidbox{flex:1;min-width:0;background:#150D11;border-radius:18px;overflow:hidden;position:relative;border:2.5px solid var(--rose-line)}
.vidbox iframe{width:100%;height:100%;border:0;display:block}
.vidph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#F0BDCC;text-align:center;padding:36px}

/* ---- đếm lỗi ---- */
.counter{width:412px;flex:none;display:flex;flex-direction:column;gap:12px}
.crow{display:flex;align-items:center;gap:11px;background:var(--paper);border:1.5px solid var(--rose-line);border-radius:15px;padding:11px 13px}
.crow .lv{flex:1;min-width:0}
.crow .lv b{display:block;font-size:21px;color:var(--rose-deep)}
.crow .lv span{font-size:16px;color:var(--ink-soft)}
.cnt{font-family:var(--f-display);font-size:38px;font-weight:700;min-width:54px;text-align:center;color:var(--rose);font-variant-numeric:tabular-nums}
button{font-family:var(--f-body);cursor:pointer}
.bq{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--rose);background:var(--paper);color:var(--rose);font-size:25px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.bq:hover{background:var(--rose);color:#fff}
.bq:active{transform:scale(.93)}
.total{display:flex;align-items:baseline;justify-content:space-between;background:var(--rose);border-radius:15px;padding:13px 20px}
.total span{font-size:21px;font-weight:700;color:#FFE3EB}
.total b{font-family:var(--f-display);font-size:44px;color:#fff}

/* ---- nút ---- */
.btn{border:2px solid var(--rose);background:var(--rose);color:#fff;border-radius:999px;padding:13px 30px;font-size:21px;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{background:var(--rose-deep);border-color:var(--rose-deep)}
.btn.ghost{background:var(--paper);color:var(--rose)}
.btn.ghost:hover{background:var(--blush)}
.btn.sm{padding:8px 19px;font-size:18px}

/* ---- bốc thăm ---- */
.draw{display:flex;gap:26px;align-items:stretch}
.drawcard{flex:1;background:var(--paper);border:2.5px dashed var(--rose-line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:34px 26px;text-align:center}
.drawcard.done{border-style:solid;border-color:var(--rose);background:var(--blush);box-shadow:var(--shadow-lift)}
.drawcard .tn{font-family:var(--f-display);font-size:36px;font-weight:700;color:var(--rose-deep);line-height:1.15}
.drawcard .vv{font-size:28px;font-weight:700;color:var(--sage);min-height:38px}
.drawcard.done .vv{color:var(--rose)}

input.tname{font-family:var(--f-display);font-size:33px;font-weight:700;color:var(--rose-deep);border:0;border-bottom:2px dashed var(--rose-line);background:transparent;width:100%;padding:4px 2px}
input.tname:focus{outline:none;border-bottom-color:var(--rose);border-bottom-style:solid}

/* ---- bìa ---- */
.cover{padding:0;flex-direction:row;background:var(--blush)}
.cover .pic{width:880px;flex:none;position:relative;overflow:hidden}
.cover .pic img{width:100%;height:100%;object-fit:cover;object-position:18% center;display:block}
.cover .pic .fade{position:absolute;inset:0 0 0 auto;width:170px;background:linear-gradient(90deg,rgba(251,236,240,0),var(--blush))}
.cover .txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 76px 0 44px}

/* ---- thanh điều khiển ---- */
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  padding:9px max(16px,env(safe-area-inset-left,0px)) calc(9px + env(safe-area-inset-bottom,0px));
  background:rgba(252,248,244,.95);border-top:1px solid var(--rose-line);font-size:15px;color:var(--ink-soft);z-index:20}
#bar.hide{display:none}
#bar .nav{display:flex;align-items:center;gap:8px}
#bar button{border:1px solid var(--rose-line);background:#fff;color:var(--rose);border-radius:999px;padding:6px 15px;font-size:15px;font-weight:600}
#bar button:hover{background:var(--blush)}
#pos{font-variant-numeric:tabular-nums;font-weight:700;color:var(--rose-deep);min-width:56px;text-align:center}
#stitle{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#warn{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:30;max-width:820px;
  background:#FFF4D6;border:2px solid #E0B457;color:#6B4A0C;border-radius:14px;padding:14px 20px;font-size:17px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.14)}
#warn b{color:#4A3206}
#warn code{background:#F6E6BE;padding:2px 7px;border-radius:5px;font-size:16px}
#warn button{margin-left:10px;border:1px solid #C9A04A;background:#fff;color:#6B4A0C;border-radius:999px;padding:5px 14px;font-size:15px;font-weight:600}

/* ---- ô chữ Game 2 ---- */
.xgrid{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.xrow{display:flex;align-items:center;gap:5px}
.xno{width:40px;height:52px;flex:none;border-radius:10px;border:2px solid var(--rose-line);background:var(--paper);
  color:var(--rose);font-family:var(--f-display);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.xno:hover{background:var(--blush)}
.xno.cur{background:var(--rose);border-color:var(--rose);color:#fff}
.xno.done{border-color:var(--sage);color:var(--sage);background:var(--sage-soft)}
.xpad{flex:none}
.xc{width:52px;height:52px;flex:none;border:2px solid var(--rose-line);border-radius:8px;background:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--rose-deep)}
.xc.key{background:var(--gold-soft);border-color:var(--gold);border-width:2.5px;color:var(--gold)}
.xc.hid{color:transparent}
.xclue{background:var(--paper);border:2.5px solid var(--rose);border-radius:16px;padding:18px 24px;display:flex;gap:20px;align-items:flex-start}
.xclue .qn{font-family:var(--f-display);font-size:38px;font-weight:700;color:var(--rose);flex:none;line-height:1}
.xbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g2t{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--rose-line);border-radius:13px;padding:7px 10px}
.g2t .nmx{font-size:19px;font-weight:600;color:var(--rose-deep);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2t .vx{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--rose);min-width:34px;text-align:center}
.bq.s{width:34px;height:34px;font-size:20px}
:focus-visible{outline:3px solid var(--sage);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="warn" hidden></div>

<div id="bar">
  <div class="nav">
    <button id="prev" title="Phím ←">←</button>
    <span id="pos">1/20</span>
    <button id="next" title="Phím → hoặc Space">→</button>
  </div>
  <span id="stitle"></span>
  <button id="fs">Toàn màn hình (F)</button>
  <button id="hidebar">Ẩn thanh này (H)</button>
  <button id="reset">Xoá điểm</button>
</div>

<script>
/* ===================== DỮ LIỆU ===================== */
var VIDEOS = [
  {id:"kDDoUg48evk", label:"Phần 16"},
  {id:"EpmeBnAcmk0", label:"Phần 17"},
  {id:"5VSq4PVu690", label:"Phần 18"}
];
var FINAL = {id:"kvjqU6M7HbU", label:"Cực khó · 90% không qua nổi Level 2"};
var SPARE = [
  {id:"XSkQtSnOCGA", label:"Phần 19", note:"Thay cho một video vòng 1"},
  {id:"vjayoC9JNTU", label:"Phần 20", note:"Thay cho một video vòng 1"},
  {id:"qqDveqc6EZA", label:"Cao thủ mới qua Level 3", note:"Thay cho video chung kết"}
];

/* Ô chữ Game 2 — bảy phụ nữ Việt Nam, cột khoá đọc dọc ra TÔN VINH.
   cells = chữ trong ô (bỏ dấu thanh, giữ ă â ê ô ơ ư đ). k = vị trí ô khoá (1-based). */
var PUZZLE = [
 {k:1,  ans:"TRIỆU THỊ TRINH", cells:["T","R","I","Ê","U","T","H","I","T","R","I","N","H"],
  clue:"Tên thật của Bà Triệu — nữ anh hùng quê Thanh Hoá, khởi nghĩa chống quân Đông Ngô năm 248.",
  src:"Báo Pháp Luật · Báo Văn Hoá"},
 {k:3,  ans:"NGÔ THỊ TUYỂN", cells:["N","G","Ô","T","H","I","T","U","Y","Ê","N"],
  clue:"Nữ dân quân Nam Ngạn vác hai hòm đạn nặng khoảng 98kg để tiếp đạn bảo vệ cầu Hàm Rồng, ngày 4/4/1965.",
  src:"VietnamPlus · VOV"},
 {k:10, ans:"LÊ THỊ XUYẾN", cells:["L","Ê","T","H","I","X","U","Y","Ê","N"],
  clue:"Hội trưởng đầu tiên của Hội Liên hiệp Phụ nữ Việt Nam, được bầu ngày 20/10/1946.",
  src:"Báo Đại biểu Nhân dân · Hội LHPN Đắk Lắk"},
 {k:1,  ans:"VÕ THỊ SÁU", cells:["V","O","T","H","I","S","A","U"],
  clue:"Người con gái anh hùng ở huyện Đất Đỏ, tỉnh Bà Rịa – Vũng Tàu.",
  src:"Bài giảng ô chữ 20/10, Violet"},
 {k:9,  ans:"NGUYỄN THỊ ĐỊNH", cells:["N","G","U","Y","Ê","N","T","H","I","Đ","I","N","H"],
  clue:"Nữ tướng đầu tiên của Quân đội nhân dân Việt Nam, được phong thiếu tướng tháng 4/1974.",
  src:"Báo Nhân Dân · Báo Văn Hoá"},
 {k:9,  ans:"HAI BÀ TRƯNG", cells:["H","A","I","B","A","T","R","Ư","N","G"],
  clue:"Hai chị em khởi nghĩa năm 40 chống quân Đông Hán — hai nữ anh hùng đầu tiên của nước ta.",
  src:"Kiddihub (đã sửa: năm 40 sau Công nguyên)"},
 {k:4,  ans:"LÝ CHIÊU HOÀNG", cells:["L","Y","C","H","I","Ê","U","H","O","A","N","G"],
  clue:"Nữ hoàng đế duy nhất trong lịch sử Việt Nam, nhường ngôi cho chồng là Trần Cảnh năm 1225.",
  src:"Znews · VOH"}
];
var KEYWORD = "TÔN VINH";
var activeRow = 0;

var DEFAULT_STATE = {
  names:["Đội Hoa Hồng","Đội Hướng Dương","Đội Thuỷ Tiên"],
  errors:[[0,0,0],[0,0,0],[0,0,0]],
  assign:null,
  finalWinner:null,
  open:[false,false,false,false,false,false,false],
  keyOpen:false,
  g2:[0,0,0]
};
var S = load();
function load(){
  try{ var raw=localStorage.getItem("gs2010"); if(raw) return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw)); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save(){ try{ localStorage.setItem("gs2010", JSON.stringify(S)); }catch(e){} }

/* ===================== TÍNH ĐIỂM ===================== */
function totalErr(i){ return S.errors[i][0]+S.errors[i][1]+S.errors[i][2]; }
function rank1(){
  var idx=[0,1,2];
  idx.sort(function(a,b){
    if(totalErr(a)!==totalErr(b)) return totalErr(a)-totalErr(b);
    if(S.errors[a][2]!==S.errors[b][2]) return S.errors[a][2]-S.errors[b][2];
    if(S.errors[a][1]!==S.errors[b][1]) return S.errors[a][1]-S.errors[b][1];
    return a-b;
  });
  var pts=[0,0,0], place=[0,0,0], give=[3,2,1];
  for(var r=0;r<3;r++){ pts[idx[r]]=give[r]; place[idx[r]]=r+1; }
  return {order:idx, pts:pts, place:place};
}
function finalPts(i){ return S.finalWinner===i ? 2 : 0; }
function totalPts(i){ return rank1().pts[i] + finalPts(i); }
function rankAll(){
  var idx=[0,1,2];
  idx.sort(function(a,b){
    if(totalPts(a)!==totalPts(b)) return totalPts(b)-totalPts(a);
    if(totalErr(a)!==totalErr(b)) return totalErr(a)-totalErr(b);
    return a-b;
  });
  return idx;
}
function closedRows(){ var n=0; for(var i=0;i<7;i++) if(!S.open[i]) n++; return n; }
function keyValue(){ var c=closedRows(); return c>=4 ? 3 : (c>=2 ? 2 : 1); }
function grandTotal(i){ return totalPts(i) + (S.g2[i]||0); }
function rankGrand(){
  var idx=[0,1,2];
  idx.sort(function(a,b){
    if(grandTotal(a)!==grandTotal(b)) return grandTotal(b)-grandTotal(a);
    if(totalErr(a)!==totalErr(b)) return totalErr(a)-totalErr(b);
    return a-b;
  });
  return idx;
}
function played(){ return totalErr(0)+totalErr(1)+totalErr(2) > 0 || S.finalWinner!==null; }
function nm(i){ return S.names[i] || ("Đội "+(i+1)); }
function vidFor(t){ return S.assign ? VIDEOS[S.assign[t]] : null; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function photoBg(){ return '<div class="bg"><img src="assets/cover.png" alt=""><div class="scrim"></div></div>'; }

/* ===================== SLIDE ===================== */
function teamCards(){
  var h="";
  for(var i=0;i<3;i++){
    h+='<div class="card" style="flex:1"><span class="step">'+(i+1)+'</span>'
      +'<input class="tname" id="tn'+i+'" value="'+esc(nm(i))+'" aria-label="Tên đội '+(i+1)+'">'
      +'<p class="muted" style="margin-top:6px">4 thành viên</p>'
      +'<p style="font-size:22px"><span class="hl sage">3 bạn</span> thi Game 1 &nbsp;·&nbsp; <span class="hl sage">1 bạn</span> giữ cho Game 2</p></div>';
  }
  return h;
}

function counterPanel(team){
  var h='<div class="counter"><p class="eyebrow" style="margin-bottom:2px">Bấm đếm lỗi</p>';
  for(var L=0;L<3;L++){
    h+='<div class="crow"><div class="lv"><b>Level '+(L+1)+'</b><span>Người chơi '+(L+1)+'</span></div>'

function xgridHTML(){
  var maxk=0,i,j;
  for(i=0;i<PUZZLE.length;i++) if(PUZZLE[i].k>maxk) maxk=PUZZLE[i].k;
  var CW=52, GP=5, h='<div class="xgrid">';
  for(i=0;i<PUZZLE.length;i++){
    var r=PUZZLE[i], pad=(maxk-r.k)*(CW+GP), opened=S.open[i];
    h+='<div class="xrow">';
    h+='<button class="xno '+(activeRow===i?'cur':'')+' '+(opened?'done':'')+'" data-act="row" data-r="'+i+'">'+(i+1)+'</button>';
    if(pad>0) h+='<div class="xpad" style="width:'+pad+'px"></div>';
    for(j=0;j<r.cells.length;j++){
      var isKey=(j===r.k-1);
      var showIt = opened || (isKey && S.keyOpen);
      h+='<div class="xc'+(isKey?' key':'')+(showIt?'':' hid')+'">'+esc(r.cells[j])+'</div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

/* ===================== CHẠY ===================== */
var SLIDES=[], cur=0, stage=document.getElementById("stage");
var BUILDERS={standings1:standings1, finalBoard:finalBoard, finalSlide:finalSlide,
              video0:function(){return videoSlide(0);}, video1:function(){return videoSlide(1);}, video2:function(){return videoSlide(2);},
              puzzle:puzzleSlide, grandFinal:grandFinal};

function render(keep){
  var prev=cur;
  SLIDES=buildSlides();
  stage.innerHTML = SLIDES.map(function(s,i){
    return '<section class="slide '+(s.cls||'')+'" data-i="'+i+'"'+(s.dyn?' data-dyn="'+s.dyn+'"':'')+'>'+s.html+'</section>';
  }).join("");
  cur = (keep===undefined) ? prev : keep;
  if(cur>=SLIDES.length) cur=SLIDES.length-1;
  show(cur);
}

function show(i){
  cur = Math.max(0, Math.min(SLIDES.length-1, i));
  var secs = stage.querySelectorAll(".slide");
  var dyn = secs[cur] && secs[cur].getAttribute("data-dyn");
  /* dựng lại slide động khi hiện ra, trừ khi video đang chạy trong đó */
  if(dyn && BUILDERS[dyn] && !secs[cur].querySelector("iframe")){
    var fresh = BUILDERS[dyn]();
    SLIDES[cur] = fresh;
    secs[cur].innerHTML = fresh.html;
  }
  for(var k=0;k<secs.length;k++){
    var on = (k===cur);
    secs[k].classList.toggle("on", on);
    var box = secs[k].querySelector(".vidbox[data-vid]");
    if(box){
      var vid = box.getAttribute("data-vid");
      if(on && vid){
        if(!box.querySelector("iframe")){
          box.innerHTML = '<iframe src="https://www.youtube.com/embed/'+vid+'?rel=0&modestbranding=1&origin='+encodeURIComponent(location.origin)+'" title="Video thử thách nói theo nhịp" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
        }
      } else if(box.querySelector("iframe")){
        box.innerHTML = "";
      }
    }
  }
  if(dyn==="draw" || secs[cur].querySelector("#drawzone")) drawZone();
  document.getElementById("pos").textContent = (cur+1)+"/"+SLIDES.length;
  document.getElementById("stitle").textContent = SLIDES[cur].title;
}

function renderPuzzle(){
  var z = stage.querySelector("#xzone");
  if(!z) return;
  z.innerHTML = xgridHTML() + xcluesHTML() + xbarHTML();
}

function drawZone(){
  var z = stage.querySelector("#drawzone");
  if(!z) return;
  var h="";
  for(var i=0;i<3;i++){
    var v=vidFor(i);
    h+='<div class="drawcard '+(v?'done':'')+'"><div class="tn">'+esc(nm(i))+'</div>'
      +'<div class="vv">'+(v?esc(v.label):'· · ·')+'</div>'
      +'<p class="muted" style="font-size:19px">'+(v?'1:41 · Level 1–3':'chưa bốc')+'</p></div>';
  }
  z.innerHTML=h;
}

function fit(){ stage.style.transform = "scale("+Math.min(window.innerWidth/1600, window.innerHeight/900)+")"; }
window.addEventListener("resize", fit);

stage.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-act]") : null;
  if(!b) return;
  var act = b.getAttribute("data-act");
  if(act==="inc" || act==="dec"){
    var t=+b.getAttribute("data-team"), L=+b.getAttribute("data-lv");
    S.errors[t][L] = Math.max(0, S.errors[t][L] + (act==="inc"?1:-1));
    save();
    var c=document.getElementById("c"+t+L); if(c) c.textContent=S.errors[t][L];
    var tt=document.getElementById("t"+t); if(tt) tt.textContent=totalErr(t);
    return;
  }
  if(act==="win"){
    var w=+b.getAttribute("data-team");
    S.finalWinner = (w<0 || S.finalWinner===w) ? null : w;
    save();
    for(var i=0;i<3;i++){ var el=document.getElementById("w"+i); if(el) el.classList.toggle("ghost", S.finalWinner!==i); }
    return;
  }
  if(act==="row"){ activeRow = +b.getAttribute("data-r"); renderPuzzle(); return; }
  if(act==="reveal"){ S.open[activeRow] = !S.open[activeRow]; save(); renderPuzzle(); return; }
  if(act==="keyopen"){ S.keyOpen = !S.keyOpen; save(); renderPuzzle(); return; }
  if(act==="g2inc" || act==="g2dec"){
    var g=+b.getAttribute("data-team");
    S.g2[g] = Math.max(0, (S.g2[g]||0) + (act==="g2inc"?1:-1));
    save(); renderPuzzle(); return;
  }
  if(act==="draw"){
    var a=[0,1,2];
    for(var j=2;j>0;j--){ var k=Math.floor(Math.random()*(j+1)), tmp=a[j]; a[j]=a[k]; a[k]=tmp; }
    S.assign=a; save(); render(); return;
  }
  if(act==="undraw"){ S.assign=null; save(); render(); return; }
});

stage.addEventListener("input", function(e){
  if(!e.target.classList || !e.target.classList.contains("tname")) return;
  var i=+e.target.id.replace("tn","");
  S.names[i]=e.target.value; save();
  var tags=stage.querySelectorAll('[data-nm="'+i+'"]');
  for(var k=0;k<tags.length;k++) tags[k].textContent = nm(i);
  var wb=document.getElementById("w"+i); if(wb) wb.textContent = nm(i);
});
stage.addEventListener("blur", function(e){
  if(e.target.classList && e.target.classList.contains("tname")) render();
}, true);

document.addEventListener("keydown", function(e){
  var t=e.target;
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA")) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); show(cur+1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); show(cur-1); }
  else if(e.key==="Home"){ show(0); }
  else if(e.key==="End"){ show(SLIDES.length-1); }
  else if(e.key==="f"||e.key==="F"){ toggleFs(); }
  else if(e.key==="h"||e.key==="H"){ document.getElementById("bar").classList.toggle("hide"); }
});
function toggleFs(){
  if(document.fullscreenElement) document.exitFullscreen();
  else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
}
document.getElementById("prev").onclick=function(){ show(cur-1); };
document.getElementById("next").onclick=function(){ show(cur+1); };
document.getElementById("fs").onclick=toggleFs;
document.getElementById("hidebar").onclick=function(){ document.getElementById("bar").classList.add("hide"); };
document.getElementById("reset").onclick=function(){ S=JSON.parse(JSON.stringify(DEFAULT_STATE)); save(); render(0); };

/* YouTube từ chối nhúng khi trang mở bằng file:// — báo cho người dùng biết đường chạy đúng */
if(location.protocol === "file:"){
  var w=document.getElementById("warn");
  w.innerHTML = '<b>Video sẽ không chạy được trong slide.</b> Trang đang mở bằng <code>file://</code>, YouTube chặn nhúng kiểu này (Error 153). '
    + 'Hãy dùng bản đã deploy trên Vercel, hoặc chạy <code>bash chay-slide.sh</code> trong thư mục này. '
    + 'Các nút “Mở tab YouTube” vẫn dùng được bình thường.'
    + '<button id="warnx">Đã hiểu</button>';
  w.hidden = false;
  document.getElementById("warnx").onclick=function(){ w.hidden=true; };
}

render(0);
fit();
</script>
